# Thresholds, dates, and the window. Change them here, not in the code.

cutoff_date: "2026-11-08"
eligibility_as_of: "2023-12-31"
min_commits_before: 50
activity_year: 2023
min_commits_in_year: 10
control_start: "2025-01-01"
quarter_start: "2022-01-01"
window_days: 30
pass_ai_after_swaps: 100
pass_ai_after_projects: 20
p2_seed: 20261108
p2_swap_sample: 30
p2_removal_sample: 30
sample_seed: 20261108
sample_size: 2000
sample_workers: 16
clone_timeout_seconds: 180
sample_clone_timeout_seconds: 600
# Whole-project limit. A repository that is still running is recorded as failed and the sample moves on.
